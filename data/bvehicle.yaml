# Udacity Self-Driving Car Dataset
# 用法: python train.py --data data/udacity.yaml

# 数据集根目录（含 JPEGImages/ 和 Annotations/）
path: /media/verser/robot/Dataset/BVehicle_Dataset
label_format: voc

# 类别列表（顺序即为 class id: 0, 1, 2, ...）
names:
  0: Sedan
  1: SUV
  2: Microbus
  3: Bus
  4: Minivan
  5: Truck


# 原始标注名 → 类别 id 的完整映射（处理别名/变体）
class_mapping:
  Sedan: 0
  SUV: 1
  Microbus: 2
  Bus: 3
  Minivan: 4
  Truck: 5
