# Udacity Self-Driving Car Dataset
# 用法: python train.py --data data/udacity.yaml

# 数据集根目录（含 JPEGImages/ 和 Annotations/）
path: /media/verser/robot/Dataset/UdacitySelfDrivingCarDataset/Driving_Car

# 类别列表（顺序即为 class id: 0, 1, 2, ...）
names:
  0: car
  1: truck
  2: pedestrian
  3: biker
  4: trafficLight

# 原始标注名 → 类别 id 的完整映射（处理别名/变体）
class_mapping:
  car: 0
  truck: 1
  pedestrian: 2
  biker: 3
  trafficLight: 4
  trafficLight-Red: 4
  trafficLight-Green: 4
  trafficLight-Yellow: 4
  trafficLight-RedLeft: 4
  trafficLight-GreenLeft: 4
  trafficLight-YellowLeft: 4
